name: Build Android APK
on:
  push:
    branches: [mobile-app]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android
      - name: Build debug APK
        working-directory: mobile
        run: npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gacha-impact-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
