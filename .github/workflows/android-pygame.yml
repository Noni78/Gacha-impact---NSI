name: Build Original Pygame APK

on:
  push:
    branches: [native-pygame-android]
    paths:
      - 'main.py'
      - 'library.py'
      - 'settings.py'
      - 'character.py'
      - 'img/**'
      - 'videos/**'
      - 'font/**'
      - 'buildozer.spec'
      - '.github/workflows/android-pygame.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev libsqlite3-dev \
            libncurses5-dev libncursesw5-dev cmake libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0 Cython==0.29.36

      - name: Cache Android build toolchain
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: android-pygame-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-pygame-${{ runner.os }}-

      - name: Build the original Pygame project
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gacha-impact-original-pygame
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
